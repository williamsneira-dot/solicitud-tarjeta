<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .app-header {
            background: #ffffff;
            padding: 16px 14px 12px 14px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .app-title {
            font-size: 1rem;
            color: var(--heading);
            font-weight: 700;
        }

        .app-subtitle {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 3px;
        }

        .form-container {
            padding: 14px 16px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 8px;
        }

        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }
            label {
                width: 170px;
                flex-shrink: 0;
                text-align: right;
            }
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--heading);
        }

        input {
            width: 100%;
            flex: 1;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #1e3a8a;
            font-weight: 700;
            background: var(--input-bg);
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.8rem;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 3px 10px rgba(13, 148, 136, 0.2);
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .success-container {
            display: none;
            padding: 35px 20px;
            text-align: center;
        }

        .success-icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }

        .success-title {
            color: var(--heading);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .success-text {
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="app-header">
        <div class="app-title">✨ Tu Tarjeta de Presentación Digital</div>
        <div class="app-subtitle">Ingresa tus datos para elaborar tu tarjeta</div>
    </div>

    <div class="form-container" id="form-block">
        <form id="data-form" onsubmit="processSubmission(event)">
            
            <div class="form-row">
                <label>Nombre completo</label>
                <input type="text" id="nombreCompleto" enterkeyhint="next" placeholder="Ej: Marlene Encina Vega" required>
            </div>

            <div class="form-row">
                <label>Empresa o emprendimiento</label>
                <input type="text" id="empresaEmprendimiento" enterkeyhint="next" placeholder="Ej: Venta Humus y Lombrices" required>
            </div>

            <div class="form-row">
                <label>Cargo o función</label>
                <input type="text" id="cargoFuncion" enterkeyhint="next" placeholder="Ej: Productora y Comercializadora" required>
            </div>

            <div class="form-row">
                <label>Título profesional u oficio</label>
                <input type="text" id="tituloOficio" enterkeyhint="next" placeholder="Ej: Técnica Agrícola, Mueblista, Fletes">
            </div>

            <div class="form-row">
                <label>Dirección completa</label>
                <input type="text" id="direccion" enterkeyhint="next" placeholder="Ej: Pasaje Los Aromas 450 (Opcional)">
            </div>

            <div class="form-row">
                <label>Ciudad</label>
                <input type="text" id="ciudad" enterkeyhint="next" placeholder="Ej: Chillán" required>
            </div>

            <div class="form-row">
                <label>Número celular (sin +56)</label>
                <input type="tel" id="celular" enterkeyhint="next" placeholder="Ej: 995797206" required>
            </div>

            <div class="form-row">
                <label>Correo electrónico</label>
                <input type="email" id="correo" enterkeyhint="next" placeholder="Ej: marleneencina@hotmail.com" required>
            </div>

            <div class="form-row">
                <label>Página web</label>
                <input type="url" id="paginaWeb" enterkeyhint="next" placeholder="Ej: https://humuschillan.cl (Opcional)">
            </div>

            <div class="form-row">
                <label>Red social principal</label>
                <input type="url" id="redSocial" enterkeyhint="done" placeholder="Ej: https://facebook.com/pagina" required>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">📩 Enviar para elaborar tarjeta</button>
        </form>
    </div>

    <div class="success-container" id="success-block">
        <div class="success-icon">✅</div>
        <div class="success-title">¡Información enviada con éxito!</div>
        <p class="success-text">
            Hemos recibido tus datos correctamente.<br>
            Nos pondremos en contacto contigo para la entrega de tu tarjeta digital.
        </p>
    </div>
</div>

<script>
    const formInputs = document.querySelectorAll('#data-form input');
    
    formInputs.forEach((input, index) => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < formInputs.length - 1) {
                    formInputs[index + 1].focus();
                } else {
                    document.getElementById('submit-btn').click();
                }
            }
        });
    });

    async function processSubmission(event) {
        event.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';

        const nombreCompleto = document.getElementById('nombreCompleto').value.trim();
        const empresaEmprendimiento = document.getElementById('empresaEmprendimiento').value.trim();
        const cargoFuncion = document.getElementById('cargoFuncion').value.trim();
        const tituloOficio = document.getElementById('tituloOficio').value.trim();
        const direccion = document.getElementById('direccion').value.trim();
        const ciudad = document.getElementById('ciudad').value.trim();
        const celularRaw = document.getElementById('celular').value.trim().replace(/\s+/g, '');
        const correo = document.getElementById('correo').value.trim();
        const paginaWeb = document.getElementById('paginaWeb').value.trim();
        const redSocial = document.getElementById('redSocial').value.trim();

        const celularFormateado = celularRaw ? (celularRaw.startsWith('+56') ? celularRaw : `+56${celularRaw}`) : '';

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        
        const timestamp = `${year}-${month}-${day}_${hours}-${minutes}-${seconds}`;
        const cleanName = (nombreCompleto ? nombreCompleto : 'cliente').replace(/[^a-zA-Z0-9_]/g, '_');
        const jsonFileName = `${cleanName}_${timestamp}.json`;

        const expiration = new Date();
        expiration.setFullYear(year + 2);

        const clientData = {
            archivo: jsonFileName,
            cliente: {
                nombreCompleto,
                empresaEmprendimiento,
                cargoFuncion,
                tituloOficio,
                direccion,
                ciudad,
                celular: celularFormateado,
                correo,
                paginaWeb,
                redSocial
            },
            servicio: {
                vigenciaDesde: `${year}-${month}-${day}`,
                vigenciaHasta: expiration.toISOString().split('T')[0],
                duracionAnos: 2
            }
        };

        const jsonString = JSON.stringify(clientData, null, 2);

        const formData = {
            _subject: `Nueva Tarjeta Digital: ${nombreCompleto || 'Cliente'} (${jsonFileName})`,
            _template: "table",
            "Nombre Completo": nombreCompleto,
            "Empresa o Emprendimiento": empresaEmprendimiento,
            "Cargo o Función": cargoFuncion,
            "Título Profesional u Oficio": tituloOficio,
            "Dirección Completa": direccion,
            "Ciudad": ciudad,
            "Número Celular": celularFormateado,
            "Correo Electrónico": correo,
            "Página Web": paginaWeb,
            "Red Social Principal": redSocial,
            "Nombre del Archivo JSON": jsonFileName,
            "Estructura JSON Completa": jsonString
        };

        try {
            const response = await fetch("https://formsubmit.co/ajax/el/heboji", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                document.getElementById('form-block').style.display = 'none';
                document.getElementById('success-block').style.display = 'block';
            } else {
                alert('Hubo un problema al enviar la información. Por favor, inténtalo de nuevo.');
                submitBtn.disabled = false;
                submitBtn.textContent = '📩 Enviar para elaborar tarjeta';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión. Por favor, verifica tu red e inténtalo de nuevo.');
            submitBtn.disabled = false;
            submitBtn.textContent = '📩 Enviar para elaborar tarjeta';
        }
    }
</script>

</body>
</html>
